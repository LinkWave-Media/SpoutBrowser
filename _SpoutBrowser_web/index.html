<html>
<!--
This lightweight vanilla JS page is used as a splash screen in the SpoutBrowser app: https://github.com/bntre/SpoutBrowser
This scene refers to the "Object2" reverse perspective experiment: https://github.com/bntre/object2-js
-->
<style>
  html, body { width: 100%; height: 100%; margin: 0; border: 0; overflow: hidden; }
  #link { position: absolute; top: 15px; left: 15px; display: flex; gap: 5px; color: #333; font-size: 14px; }
  #link img { height: 15px; }
</style>
<body>
<a id="link" href="https://github.com/bntre/SpoutBrowser">
  <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" />
  <span>SpoutBrowser</span>
</a>
<canvas id="canvas"></canvas>
<script type="text/javascript">

//----------------------------------------------------------
// Math

// Vector
class Vec extends Float32Array {
  constructor(...xs) { super(xs); }
  add(v) { v.forEach((x, i) => { this[i] += x; }); }
  sub(v) { v.forEach((x, i) => { this[i] -= x; }); }
  mul(k) { this.forEach((x, i) => { this[i] = x*k; }); }
  dot(v) { return this.reduce((s, x, i) => s + x*v[i], 0); }
  len() { return Math.sqrt(this.dot(this)); }
  normalize() { this.mul(1 / this.len()); }
}

// Matrix
class Mat extends Float32Array {
  constructor() { super(16); }
  id() { this.fill(0); this[0] = this[5] = this[10] = this[15] = 1; }
  rot(i,j,a) {
    this.id();
    const c = Math.cos(a);
    const s = Math.sin(a);
    this[i*4 + i] = c; this[i*4 + j] = -s;
    this[j*4 + i] = s; this[j*4 + j] =  c;
  }
  
  static #tm = new Mat(); // temporal
  static #mul(a, b) {
    const t = Mat.#tm;
    t.fill(0);
    let c=0;
    for (let i=0; i<4; ++i)
     for (let j=0; j<4; ++j, ++c)
      for (let k=0; k<4; ++k)
        t[c] += a[i*4 + k] * b[k*4 + j];
  }
  mul(m)    { Mat.#mul(m, this); this.set(Mat.#tm); }
  preMul(m) { Mat.#mul(this, m); this.set(Mat.#tm); }

  static #tv = new Vec(0,0,0,0); // temporal
  trans(out, v3) {
    const t = Mat.#tv;
    t.fill(0);
    for (let i=0; i<4; ++i)
     for (let k=0; k<4; ++k)
       t[i] += this[i*4 + k] * (k < 3 ? v3[k] : 1);
    const [x,y,z,w] = t;
    out.set([x/w, y/w, z/w]);
  }
}

//----------------------------------------------------------
// Scene

const _matWorld = new Mat(); _matWorld.id(); // collecting rotations
const _matProj  = new Mat(); _matProj.id(); // with current perspective coefficient
const _lightDir = new Vec(-1,-1,0); _lightDir.normalize();

const _obj = makeObject2();
//console.log(_obj);

function makeObject2() {

  const verts = []; // 64 vertices (mask 0x3F)
  const faces = [];
  const normals = [];
  
  // vertex grid
  const xs = [-3,-1,1,3];
  for (const x of xs)
   for (const y of xs)
    for (const z of xs) {
      verts.push({ 
        m: new Vec(x,y,z), // model space
        s: [0,0], // screen scape
      });
    }
  
  // faces
  for (const o of [0,1,2]) { // orientation XYZ, YZX, ZXY
    for (const d of [0,1]) { // direction
      for (const ii of [[10,2,3,15,12,8],[37,41,40,32,34,38]]) { // 2 hexagon faces per direction
        if (d) { ii.push(ii.shift()); ii.reverse(); } // reverse to keep clockwise; shift to keep 1st point (ref for z-depth)
        const vs = ii.map(i => verts[(i>>(2*o) | i<<(6-2*o) & 0x3F) ^ [0,0x3F][d]]);
        faces.push({ vs, n: normals.length });
      }
      const n = new Vec(0,0,0); n[o] = [-1,1][d]; // normal
      normals.push({ n, c: 0 });
    }
  }

  // skipping unused vertices
  const usedVerts = new Set(faces.flatMap(f => f.vs));

  return {
    verts: verts.filter(v => usedVerts.has(v)),
    faces,
    normals
  };
}

//------------------------------------------------------------------
// Canvas

let _winW = 0, _winH = 0, _winSize = 0;
let _scale = 0.05;

const _canvas = document.getElementById('canvas');

const _ctx = _canvas.getContext("2d");

window.onresize = resizeCanvas;
resizeCanvas();

function resizeCanvas() {
    // resize canvas
    _canvas.width  = window.innerWidth;
    _canvas.height = window.innerHeight;
    // update sizes
    _winW = _canvas.width;
    _winH = _canvas.height;
    _winSize = Math.sqrt(_winW * _winH);
};

// Drawing

function screenFromClip(s, c) {
  s[0] = c[0]*_scale*_winSize + _winW/2;
  s[1] = c[1]*_scale*_winSize + _winH/2;
}

function isFaceVisible(f) { // face culling
  const x1 = f.vs[1].s[0] - f.vs[0].s[0];
  const y1 = f.vs[1].s[1] - f.vs[0].s[1];
  const x2 = f.vs[2].s[0] - f.vs[0].s[0];
  const y2 = f.vs[2].s[1] - f.vs[0].s[1];
  const d = x1*y2 - x2*y1;
  return d <= 0;
}

const _colors = Array.from({ length: 50 }, (_, i) => {
  const c = 256 - (50 - i);
  return `rgb(${c},${c},${c})`;
});

function drawFace(f) {
  _ctx.beginPath();
  let i = 0;
  for (const v of f.vs) {
    if (i++ === 0) _ctx.moveTo(...v.s);
    else           _ctx.lineTo(...v.s);
  }
  _ctx.closePath();
  _ctx.fillStyle = _colors[_obj.normals[f.n].c]; // set "rgb(...)" color
  _ctx.fill();
}

const matPW = new Mat();
const vecT = new Vec(0,0,0); // temporal transformed vector

function drawFrame() {

  // transform all vertices

  matPW.set(_matWorld);
  matPW.mul(_matProj);

  const s = _winSize * 0.08; // scale
  for (const v of _obj.verts) {
    matPW.trans(vecT, v.m); // clip <- model
    screenFromClip(v.s, vecT); // screen <- clip
    v.z = vecT[2]; // z-depth
  }

  // set color index per normal
  for (const n of _obj.normals) {
    _matWorld.trans(vecT, n.n);
    let d = _lightDir.dot(vecT); // -1..1
    n.c = Math.floor(_colors.length*(d+1)/2.001); // [0.._colors.length-1]
  }

  // get visible faces
  const fs = _obj.faces.filter(f => isFaceVisible(f));
  // z-order faces
  fs.sort((a,b) => b.vs[0].z - a.vs[0].z);
  // draw faces
  _ctx.clearRect(0, 0, _winW, _winH);
  for (const f of fs) {
    drawFace(f);
  }
}

//------------------------------------------------------------------
// Control

let _mouseIsPressed = false;

const _mousePos  = new Vec(0, 0); // normalized mouse coordinates ~(-1..1)
const _mouseDrag = new Vec(0, 0); // prev dragged

function updateMousePos(x, y) {
  _mousePos[0] = (x*2 - _winW) / _winSize;
  _mousePos[1] = (y*2 - _winH) / _winSize;
}
function resetDrag(d) {
  if (d) { // get drag delta
    d.set(_mousePos);
    d.sub(_mouseDrag);
  }
  _mouseDrag.set(_mousePos);
}

// Mouse handlers
_canvas.addEventListener('mousedown', (e) => {
  if (e.buttons === 1) {
    updateMousePos(e.clientX, e.clientY);
    resetDrag();
    _mouseIsPressed = true;
  }
});
window.addEventListener('mouseup', (e) => {
  if (e.buttons === 0) {
    _mouseIsPressed = false;
  }
});
_canvas.addEventListener("mousemove", function (e) {
  if (_mouseIsPressed) {
    updateMousePos(e.clientX, e.clientY);
  }
}, false);

const matStep = new Mat();
const dragDelta = new Vec(0,0);
function changeMatricesByMouse(delta) {
  resetDrag(dragDelta);
  if (delta > 1.0) return; // skip lags
  // World
  matStep.rot(0,2, 5 * dragDelta[0]); _matWorld.mul(matStep);
  matStep.rot(1,2, 5 * dragDelta[1]); _matWorld.mul(matStep);
  // Proj
  _matProj[14] += -0.25 * dragDelta[1];
}
function changeMatricesByTime(time) {
  const a = Math.PI * time;
  // World
  _matWorld.id();
  matStep.rot(0,2, a);              _matWorld.mul(matStep);
  matStep.rot(1,2, 0.06 * Math.PI); _matWorld.mul(matStep);
  // Proj
  _matProj[14] = 0.08 * Math.cos(a);
}

//------------------------------------------------------------------
// Animate

let prevTime = 0;
function animate(time) {
  const delta = time - prevTime;
  prevTime = time;

  if (_mouseIsPressed) {
    changeMatricesByMouse(delta/1000);
  } else {
    changeMatricesByTime(time/1000);
  }
  drawFrame();
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

</script>
</body>
</html>
