<html>
<!--
This lightweight vanilla JS page is used as a splash screen in the SpoutBrowser app: https://github.com/bntre/SpoutBrowser
This scene refers to the "Object2" reverse perspective experiment: https://github.com/bntre/object2-js
-->
<title>SpoutBrowser</title>
<style>
  html, body { width: 100%; height: 100%; margin: 0; border: 0; overflow: hidden; }
  #link { position: absolute; top: 15px; left: 15px; display: flex; gap: 5px; color: #777; font-size: 14px; }
  #link img { height: 15px; }
  #auth-container {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(30, 30, 46, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(137, 180, 250, 0.2);
    border-radius: 12px;
    padding: 12px 16px;
    color: #cdd6f4;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    min-width: 200px;
    z-index: 1000;
  }
  .google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #ffffff;
    color: #1f1f1f;
    border: 1px solid #dadce0;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color .15s, box-shadow .15s;
    width: 100%;
  }
  .google-btn:hover {
    background-color: #f8fafd;
    box-shadow: 0 1px 3px rgba(60,64,67, 0.3), 0 4px 8px 3px rgba(60,64,67, 0.15);
  }
  .google-btn img {
    width: 18px;
    height: 18px;
  }
  .user-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .user-name {
    font-weight: 600;
    color: #89b4fa;
  }
  .user-email {
    font-size: 12px;
    color: #a6adc8;
    margin-bottom: 8px;
  }
  .logout-btn {
    background: transparent;
    border: 1px solid #f38ba8;
    color: #f38ba8;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .logout-btn:hover {
    background: #f38ba8;
    color: #1e1e2e;
  }
  .spinner {
    border: 2px solid rgba(137, 180, 250, 0.1);
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border-left-color: #89b4fa;
    animation: spin 1s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
<body>
<a id="link" href="https://github.com/bntre/SpoutBrowser">
  <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" />
  <span>SpoutBrowser</span>
</a>
<div id="auth-container">
  <div id="auth-unauthenticated" style="display: none;">
    <button class="google-btn" onclick="startGoogleLogin()">
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google G Logo"/>
      <span>Sign in with Google</span>
    </button>
  </div>
  <div id="auth-loading">
    <div class="spinner"></div>
    <span>Checking session...</span>
  </div>
  <div id="auth-authenticated" style="display: none;">
    <div class="user-info">
      <span class="user-name" id="user-name"></span>
      <span class="user-email" id="user-email"></span>
      <button class="logout-btn" onclick="googleLogout()">Sign out</button>
    </div>
  </div>
</div>
<canvas id="canvas"></canvas>
<script type="text/javascript">

//----------------------------------------------------------
// Math

// Vector
class Vec extends Float32Array {
  constructor(...xs) { super(xs); }
  add(v) { v.forEach((x, i) => { this[i] += x; }); }
  sub(v) { v.forEach((x, i) => { this[i] -= x; }); }
  mul(k) { this.forEach((x, i) => { this[i] = x*k; }); }
  dot(v) { return this.reduce((s, x, i) => s + x*v[i], 0); }
  len() { return Math.sqrt(this.dot(this)); }
  normalize() { this.mul(1 / this.len()); }
}

// Matrix
class Mat extends Float32Array {
  constructor() { super(16); }
  id() { this.fill(0); this[0] = this[5] = this[10] = this[15] = 1; }
  rot(i,j,a) {
    this.id();
    const c = Math.cos(a);
    const s = Math.sin(a);
    this[i*4 + i] = c; this[i*4 + j] = -s;
    this[j*4 + i] = s; this[j*4 + j] =  c;
  }
  
  static #tm = new Mat(); // temporal
  static #mul(a, b) {
    const t = Mat.#tm;
    t.fill(0);
    let c=0;
    for (let i=0; i<4; ++i)
     for (let j=0; j<4; ++j, ++c)
      for (let k=0; k<4; ++k)
        t[c] += a[i*4 + k] * b[k*4 + j];
  }
  mul(m)    { Mat.#mul(m, this); this.set(Mat.#tm); }
  preMul(m) { Mat.#mul(this, m); this.set(Mat.#tm); }

  static #tv = new Vec(0,0,0,0); // temporal
  trans(out, v3) {
    const t = Mat.#tv;
    t.fill(0);
    for (let i=0; i<4; ++i)
     for (let k=0; k<4; ++k)
       t[i] += this[i*4 + k] * (k < 3 ? v3[k] : 1);
    const [x,y,z,w] = t;
    out.set([x/w, y/w, z/w]);
  }
}

//----------------------------------------------------------
// Scene

const _matWorld = new Mat(); _matWorld.id(); // collecting rotations
const _matProj  = new Mat(); _matProj.id(); // with current perspective coefficient
const _lightDir = new Vec(-1,-1,0); _lightDir.normalize();

const _obj = makeObject2();
//console.log(_obj);

function makeObject2() {

  const verts = []; // 64 vertices (mask 0x3F)
  const faces = [];
  const normals = [];
  
  // vertex grid
  const xs = [-3,-1,1,3];
  for (const x of xs)
   for (const y of xs)
    for (const z of xs) {
      verts.push({ 
        m: new Vec(x,y,z), // model space
        s: [0,0], // screen scape
      });
    }
  
  // faces
  for (const o of [0,1,2]) { // orientation XYZ, YZX, ZXY
    for (const d of [0,1]) { // direction
      for (const ii of [[10,2,3,15,12,8],[37,41,40,32,34,38]]) { // 2 hexagon faces per direction
        if (d) { ii.push(ii.shift()); ii.reverse(); } // reverse to keep clockwise; shift to keep 1st point (ref for z-depth)
        const vs = ii.map(i => verts[(i>>(2*o) | i<<(6-2*o) & 0x3F) ^ [0,0x3F][d]]);
        faces.push({ vs, n: normals.length });
      }
      const n = new Vec(0,0,0); n[o] = [-1,1][d]; // normal
      normals.push({ n, c: 0 });
    }
  }

  // skipping unused vertices
  const usedVerts = new Set(faces.flatMap(f => f.vs));

  return {
    verts: verts.filter(v => usedVerts.has(v)),
    faces,
    normals
  };
}

//------------------------------------------------------------------
// Canvas

let _winW = 0, _winH = 0, _winSize = 0;
let _scale = 0.05;

const _canvas = document.getElementById('canvas');

const _ctx = _canvas.getContext("2d");

window.onresize = resizeCanvas;
resizeCanvas();

function resizeCanvas() {
    // resize canvas
    _canvas.width  = window.innerWidth;
    _canvas.height = window.innerHeight;
    // update sizes
    _winW = _canvas.width;
    _winH = _canvas.height;
    _winSize = Math.sqrt(_winW * _winH);
};

// Drawing

function screenFromClip(s, c) {
  s[0] = c[0]*_scale*_winSize + _winW/2;
  s[1] = c[1]*_scale*_winSize + _winH/2;
}

function isFaceVisible(f) { // face culling
  const x1 = f.vs[1].s[0] - f.vs[0].s[0];
  const y1 = f.vs[1].s[1] - f.vs[0].s[1];
  const x2 = f.vs[2].s[0] - f.vs[0].s[0];
  const y2 = f.vs[2].s[1] - f.vs[0].s[1];
  const d = x1*y2 - x2*y1;
  return d <= 0;
}

const _colors = Array.from({ length: 50 }, (_, i) => {
  const c = 256 - (50 - i);
  return `rgb(${c},${c},${c})`;
});

function drawFace(f) {
  _ctx.beginPath();
  let i = 0;
  for (const v of f.vs) {
    if (i++ === 0) _ctx.moveTo(...v.s);
    else           _ctx.lineTo(...v.s);
  }
  _ctx.closePath();
  _ctx.fillStyle = _colors[_obj.normals[f.n].c]; // set "rgb(...)" color
  _ctx.fill();
}

const matPW = new Mat();
const vecT = new Vec(0,0,0); // temporal transformed vector

function drawFrame() {

  // transform all vertices

  matPW.set(_matWorld);
  matPW.mul(_matProj);

  const s = _winSize * 0.08; // scale
  for (const v of _obj.verts) {
    matPW.trans(vecT, v.m); // clip <- model
    screenFromClip(v.s, vecT); // screen <- clip
    v.z = vecT[2]; // z-depth
  }

  // set color index per normal
  for (const n of _obj.normals) {
    _matWorld.trans(vecT, n.n);
    let d = _lightDir.dot(vecT); // -1..1
    n.c = Math.floor(_colors.length*(d+1)/2.001); // [0.._colors.length-1]
  }

  // get visible faces
  const fs = _obj.faces.filter(f => isFaceVisible(f));
  // z-order faces
  fs.sort((a,b) => b.vs[0].z - a.vs[0].z);
  // draw faces
  _ctx.clearRect(0, 0, _winW, _winH);
  for (const f of fs) {
    drawFace(f);
  }
}

//------------------------------------------------------------------
// Control

let _mouseIsPressed = false;

const _mousePos  = new Vec(0, 0); // normalized mouse coordinates ~(-1..1)
const _mouseDrag = new Vec(0, 0); // prev dragged

function updateMousePos(x, y) {
  _mousePos[0] = (x*2 - _winW) / _winSize;
  _mousePos[1] = (y*2 - _winH) / _winSize;
}
function resetDrag(d) {
  if (d) { // get drag delta
    d.set(_mousePos);
    d.sub(_mouseDrag);
  }
  _mouseDrag.set(_mousePos);
}

// Mouse handlers
_canvas.addEventListener('mousedown', (e) => {
  if (e.buttons === 1) {
    updateMousePos(e.clientX, e.clientY);
    resetDrag();
    _mouseIsPressed = true;
  }
});
window.addEventListener('mouseup', (e) => {
  if (e.buttons === 0) {
    _mouseIsPressed = false;
  }
});
_canvas.addEventListener("mousemove", function (e) {
  if (_mouseIsPressed) {
    updateMousePos(e.clientX, e.clientY);
  }
}, false);

const matStep = new Mat();
const dragDelta = new Vec(0,0);
function changeMatricesByMouse(delta) {
  resetDrag(dragDelta);
  if (delta > 1.0) return; // skip lags
  // World
  matStep.rot(0,2, 5 * dragDelta[0]); _matWorld.mul(matStep);
  matStep.rot(1,2, 5 * dragDelta[1]); _matWorld.mul(matStep);
  // Proj
  _matProj[14] += -0.25 * dragDelta[1];
}
function changeMatricesByTime(time) {
  const a = Math.PI * time;
  // World
  _matWorld.id();
  matStep.rot(0,2, a);              _matWorld.mul(matStep);
  matStep.rot(1,2, 0.06 * Math.PI); _matWorld.mul(matStep);
  // Proj
  _matProj[14] = 0.08 * Math.cos(a);
}

//------------------------------------------------------------------
// Animate

let prevTime = 0;
function animate(time) {
  const delta = time - prevTime;
  prevTime = time;

  if (_mouseIsPressed) {
    changeMatricesByMouse(delta/1000);
  } else {
    changeMatricesByTime(time/1000);
  }
  drawFrame();
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

//------------------------------------------------------------------
// Google Auth Integration

function setAuthStatus(status, user) {
  const elUnauth = document.getElementById('auth-unauthenticated');
  const elLoading = document.getElementById('auth-loading');
  const elAuth = document.getElementById('auth-authenticated');

  elUnauth.style.display = 'none';
  elLoading.style.display = 'none';
  elAuth.style.display = 'none';

  if (status === 'unauthenticated') {
    elUnauth.style.display = 'block';
  } else if (status === 'loading') {
    elLoading.style.display = 'block';
    const loadingText = user ? user.message : 'Waiting for authentication...';
    elLoading.querySelector('span').innerText = loadingText;
  } else if (status === 'authenticated') {
    elAuth.style.display = 'block';
    document.getElementById('user-name').innerText = user.name || 'User';
    document.getElementById('user-email').innerText = user.email || '';
  }
}

function startGoogleLogin() {
  if (!window.cefQuery) {
    alert("CEF Query interface not available.");
    return;
  }
  setAuthStatus('loading', { message: 'Sign in started...' });
  window.cefQuery({
    request: 'google-login',
    onSuccess: function(response) {
      try {
        const user = JSON.parse(response);
        setAuthStatus('authenticated', user);
      } catch (e) {
        setAuthStatus('unauthenticated');
      }
    },
    onFailure: function(error_code, error_message) {
      alert('Login failed: ' + error_message);
      setAuthStatus('unauthenticated');
    }
  });
}

function googleLogout() {
  if (!window.cefQuery) return;
  window.cefQuery({
    request: 'google-logout',
    onSuccess: function(response) {
      setAuthStatus('unauthenticated');
    }
  });
}

// Initial session check
window.addEventListener('DOMContentLoaded', () => {
  if (window.cefQuery) {
    window.cefQuery({
      request: 'google-check-auth',
      onSuccess: function(response) {
        if (response && response !== 'none') {
          try {
            const user = JSON.parse(response);
            setAuthStatus('authenticated', user);
          } catch(e) {
            setAuthStatus('unauthenticated');
          }
        } else {
          setAuthStatus('unauthenticated');
        }
      },
      onFailure: function() {
        setAuthStatus('unauthenticated');
      }
    });
  } else {
    // Non-CEF browser fallback
    setAuthStatus('unauthenticated');
  }
});

</script>
</body>
</html>
